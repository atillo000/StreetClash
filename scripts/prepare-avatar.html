<!doctype html><meta charset="utf-8"><base href="/"><title>Prepare custom avatar</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<h1>Prepare custom avatar</h1><p>Start npm start and node scripts/asset-prep-server.mjs first. This updates only the generated avatar GLB and report.</p><button id="prepare">Prepare avatar</button><pre id="report"></pre>
<script type="module">const button=document.getElementById('prepare'),report=document.getElementById('report');button.onclick=async()=>{button.disabled=true;report.textContent='Retargeting and exporting…';window.__prepareFighter='avatar';try{const source=await fetch('/scripts/prepare-user-fighter.js').then(r=>{if(!r.ok)throw Error('Missing preparer');return r.text();});const result=await eval(source);report.textContent=JSON.stringify(result,null,2);}catch(error){report.textContent=error.message;}finally{button.disabled=false;}};</script>
